name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # pnpm 12 供应链新政：lockfile 已冻结版本，豁免发布年龄拦截保 CI 稳定
      npm_config_minimum_release_age: '0'
    steps:
      - uses: actions/checkout@v4

      # action-setup@v4 在当前 runner 上拉取 pnpm 失败，改用 npm 全局安装（runner 自带 node/npm）
      - name: Setup pnpm
        run: npm install -g pnpm@12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm --filter frontend build
