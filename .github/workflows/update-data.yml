name: Update Data

# 数据自动更新：每日三批次（北京时间 05:00 主批次 + 07:30 与 BI 对齐批次 + 21:00 晚间收敛批次）→ v3 月度分片全量重生成 → commit → 部署。
# 数仓 T+1 05:00 同步完成后立即拉取；观远 BI 数据集每日约 06:01 抽取数仓，
# 07:30 批次在 BI 抽取之后运行，保证 9:00 前看板与 BI 数据状态一致（GMV 口径：行级 ROUND 2 位后求和，2026-11-17 定版）；
# 晚间批次收敛白天迟到回传（易仓 status=4 延迟回填、广告平台回传修正），
# 保证白天任意时段打开看板与 BI 实时数据的偏差不超过半天。
# 全量（REORC_START 默认 2025-01-01 起，含 2025 历史年）幂等重生成：历史月份迟到回传自然收敛，
# 月分片 months/<YYYY-MM>.json 前端按需加载。
# 依赖 Secrets：REORC_OPENAPI_KEY（推荐主通道，数据服务个人 API 密钥，长期有效）/ REORC_TOKEN（兜底，登录 JWT 约 7 天过期）/
# REORC_BASE_URL（可选，默认 api.cn.reorc.cloud）
# 见 docs/SECRETS.md
on:
  schedule:
    - cron: '0 21 * * *' # UTC 21:00 = 北京 05:00（主批次，T+1 数据同步完成后；窗口=近 2 自然月）
    - cron: '30 23 * * *' # UTC 23:30 = 北京 07:30（与观远 BI 对齐批次：BI 每日约 06:01 抽取数仓，本批取相同数据状态；
                          #   兼作 GitHub schedule 丢触发/延迟兜底——主批次已成功时本次 changed=false 不部署，无副作用）
    - cron: '0 13 * * *' # UTC 13:00 = 北京 21:00（晚间批次，收敛白天迟到回传）
    - cron: '0 7 * * 0'  # UTC 07:00 周日 = 北京 15:00 低峰：全历史 23 个月幂等重生成（纯覆盖），
                         #   收敛历史月迟到回传。2026-11-26 定版：2025-11 大促月等深水区在早晨/深夜负载下
                         #   连单日防线也终败（run#56 + 本地两次复现实锤），仅下午低峰可过——全量固定低峰周日跑
  workflow_dispatch:
    inputs:
      probe:
        description: '探查模式：列出数仓连接/库/表后退出（不拉数，用于细化 SQL 表名）'
        type: boolean
        default: false
      probe_sql:
        description: '定向探查：分号分隔的 SQL 列表（设置后仅执行这些语句，连接取 probe_conn）'
        type: string
        default: ''
      probe_conn:
        description: '定向探查使用的连接名（默认 selectdb）'
        type: string
        default: ''
      start:
        description: '月度回填起点（默认 2025-01-01；临时验证可改窄）'
        type: string
        default: ''
      end:
        description: '月度回填终点（默认北京昨日）'
        type: string
        default: ''

permissions:
  contents: write # 提交数据文件
  issues: write # 失败自动开告警 issue
  pages: write # 数据更新后重新部署
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    name: 拉数 + 校验 + 提交
    runs-on: ubuntu-latest
    # 全历史 openapi 通道实测 ~3.75h（2026-11-25：旺季月多毛刺周，每毛刺周二分降级 ~2min）；
    # 公开仓库 Actions 不限时长，240 留足余量（单 job 平台上限 360）
    timeout-minutes: 240
    env:
      # pnpm 12 供应链新政：lockfile 已冻结版本，豁免发布年龄拦截保 CI 稳定
      npm_config_minimum_release_age: '0'
    outputs:
      changed: ${{ steps.data.outputs.changed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      # REORC_TOKEN 过期预警（2026-11-25 断更 4 天事故防复发）：剩余 <48h 自动开 issue 提醒续期，不阻塞本次拉数
      - name: Token expiry pre-check
        env:
          REORC_TOKEN: ${{ secrets.REORC_TOKEN }}
        uses: actions/github-script@v7
        with:
          script: |
            const tok = (process.env.REORC_TOKEN || '').replace(/^\s*[Bb]earer\s+/, '').trim();
            const parts = tok.split('.');
            if (parts.length !== 3) {
              core.warning('REORC_TOKEN 非 JWT 形式，无法解析过期时间');
              return;
            }
            const exp = JSON.parse(Buffer.from(parts[1], 'base64').toString('utf8')).exp;
            const remainH = (exp * 1000 - Date.now()) / 3600000;
            core.notice('REORC_TOKEN 剩余有效期约 ' + remainH.toFixed(1) + ' 小时（exp=' + new Date(exp * 1000).toISOString() + '）');
            if (remainH >= 48) return;
            const title = '[自动告警] REORC_TOKEN 即将过期（<48h），请续期';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'token-expiry-warning',
            });
            const body = [
              'REORC_TOKEN 剩余有效期约 **' + remainH.toFixed(1) + ' 小时**（过期时间 ' + new Date(exp * 1000).toISOString() +
                '，北京时间 ' + new Date(exp * 1000).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' }) + '）。',
              '',
              '续期步骤（见 docs/SECRETS.md）：',
              '1. 本地终端执行 `reorc-cli login`（浏览器完成登录）',
              '2. 将新 token 更新到 Settings → Secrets and variables → Actions → `REORC_TOKEN`',
              '',
              '续期完成并确认 update-data 成功后关闭本 issue。',
            ].join('\n');
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['token-expiry-warning'],
              });
            } else if (issues[0].updated_at < new Date(Date.now() - 6 * 3600 * 1000).toISOString()) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }

      # action-setup@v4 在当前 runner 上拉取 pnpm 失败，改用 npm 全局安装（runner 自带 node/npm）
      - name: Setup pnpm
        run: npm install -g pnpm@12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 窗口解析（2026-11-26 定版）：手动 dispatch 用输入值；周日 15:00 低峰批次全历史；
      # 其余日常批次近 2 自然月（~40min，避开 2025-11 大促月深水区——早晨/深夜必死），
      # 窗口外历史月份分片由 emit 合并基线保留（PIPELINE_MERGE），迟到回传由周日全量收敛
      - name: Resolve start
        id: start
        run: |
          if [ -n "${{ inputs.start }}" ]; then
            echo "start=${{ inputs.start }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * 0" ]; then
            echo "start=2025-01-01" >> "$GITHUB_OUTPUT"
          else
            echo "start=$(date -d '-1 month' +%Y-%m-01)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline (monthly slices)
        env:
          REORC_BASE_URL: ${{ secrets.REORC_BASE_URL }}
          # 主通道：开放 API（数据服务 preview，个人 API 密钥长期有效，摆脱登录 token 过期依赖）；
          # 缺失时 cli 自动回退 REORC_TOKEN sql-query 通道
          REORC_OPENAPI_KEY: ${{ secrets.REORC_OPENAPI_KEY }}
          REORC_TOKEN: ${{ secrets.REORC_TOKEN }}
          # 取数目标（sql-query 兜底通道）：selectdb 连接的 data_warehouse_prod（广告聚合层），SQL 内仍带 schema 前缀双保险
          REORC_CONNECTION_NAME: selectdb
          REORC_DATABASE: data_warehouse_prod
          # v3 月度分片：REORC_START~REORC_END 按自然月逐月拉取
          PIPELINE_MODE: monthly
          PIPELINE_PROBE: ${{ inputs.probe }}
          REORC_START: ${{ steps.start.outputs.start }}
          REORC_END: ${{ inputs.end }}
          # 近窗日常批次合并旧基线（不丢历史月份）；周日全量批次纯覆盖（口径变更时的重置语义）
          PIPELINE_MERGE: ${{ github.event_name == 'schedule' && github.event.schedule == '0 7 * * 0' && 'false' || 'true' }}
          REORC_PROBE_SQL: ${{ inputs.probe_sql }}
          REORC_PROBE_CONN: ${{ inputs.probe_conn }}
        run: pnpm --filter pipeline start

      - name: Check data changes
        id: data
        run: |
          if [ -n "$(git status --porcelain frontend/public/data)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit data
        id: push
        if: steps.data.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          git commit -m "chore(data): auto update via update-data workflow [skip ci]"
          # push 重试 3 次：runner 出口对 github.com 间歇阻断、以及人工 push 并行推进 main
          # 造成的瞬时失败/非快进（2026-11-17 Run#30 事故，commit 后 push 失败致数据丢失）
          for i in 1 2 3; do
            if git push; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push 第 $i 次失败，30s 后 rebase 追平重试"
            sleep 30
            git pull --rebase origin main || true
          done
          exit 1

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[自动告警] 数据更新管道失败';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-update-failure',
            });
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '数据更新管道执行失败，站点仍使用上一次成功部署的数据。',
              '',
              `- 失败运行：${runUrl}`,
              `- 触发方式：${context.eventName}`,
              `- 失败时间：${new Date().toISOString()}`,
              '',
              '常见原因：',
              '1. 开放 API 鉴权失败（REORC_OPENAPI_KEY 缺失/失效）→ 数据服务页「如何调用 API?」弹窗重新复制密钥并更新 Secrets',
              '2. `REORC_TOKEN` 过期（兜底通道）→ 本地终端执行 `reorc-cli login` 刷新后更新 Secrets（见 docs/SECRETS.md）',
              '3. ReOrc 平台数据模型未就绪或口径变更 → 检查 preview-data 输出',
              '4. 云端 runner 网络可达性 → 手动 Run workflow 复现排查',
              '',
              '修复并确认成功后请关闭本 issue。',
            ].join('\n');
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['data-update-failure'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }

  deploy:
    name: 数据变更后部署
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_minimum_release_age: '0'
    # 与 deploy.yml 共用 group，互斥防止部署冲突
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 必须显式 checkout update job 刚 push 的数据 commit：默认 checkout github.sha =
      # schedule 触发时的 main 快照，不含本 run 推送的数据，会"部署成功但上线旧数据"
      # （2026-11-18 事故：部署了 a119aec 旧数据，11-17 数据未上线，9:00 看板全 0）
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.sha }}

      # action-setup@v4 在当前 runner 上拉取 pnpm 失败，改用 npm 全局安装（runner 自带 node/npm）
      - name: Setup pnpm
        run: npm install -g pnpm@12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build

      # schedule 批次上线前校验数据新鲜度：manifest 必须覆盖北京昨日（T+1），
      # 防止"部署成功但部署的是旧数据"的静默故障；workflow_dispatch 回填历史窗口时跳过
      - name: Verify data freshness
        if: github.event_name == 'schedule'
        run: |
          expected=$(TZ=Asia/Shanghai date -d yesterday +%F)
          actual=$(node -e "console.log(require('./frontend/dist/data/manifest.json').range.max)")
          echo "期望覆盖北京昨日=$expected，实际=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::数据未覆盖北京昨日 $expected（actual=$actual）：拉数/提交/部署链路异常"
            exit 1
          fi

      # Pages 站点已通过 API 启用(build_type=workflow)，此处仅读取配置
      - uses: actions/configure-pages@v5

      # rerun-failed-jobs 防护：本 workflow 的 upload 与 deploy 同 job，重跑会再上传同名 artifact，
      # deploy-pages 检测到 2 个同名直接失败（2026-11-25 Run#54）。upload 前先清理本 run 同名 artifact
      - name: Remove stale pages artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { data: arts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'github-pages',
            });
            for (const a of arts.artifacts) {
              if (a.workflow_run && a.workflow_run.id === context.runId && !a.expired) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id,
                });
                core.notice('removed stale github-pages artifact ' + a.id);
              }
            }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
